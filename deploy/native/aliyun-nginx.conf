# Existing Baota Nginx includes /www/server/panel/vhost/nginx/*.conf.
# This IP-specific host leaves the existing 8088 site unchanged.
server {
    listen 80;
    server_name 123.56.135.166;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/gpu-radar-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://123.56.135.166$request_uri; }
}

server {
    listen 443 ssl;
    server_name 123.56.135.166;
    ssl_certificate /etc/gpu-radar/letsencrypt/live/gpu-radar-ip/fullchain.pem;
    ssl_certificate_key /etc/gpu-radar/letsencrypt/live/gpu-radar-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:GPU_RADAR_TLS:1m;
    ssl_session_timeout 1d;
    client_max_body_size 1m;
    client_body_timeout 15s;
    add_header X-Content-Type-Options nosniff always;
    access_log /www/wwwlogs/gpu-radar-access.log;
    error_log /www/wwwlogs/gpu-radar-error.log warn;
    location /agent/ {
        alias /opt/gpu-radar/downloads/agent/;
        autoindex off;
        default_type application/octet-stream;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "no-cache";
    }
    location /api/ {
        proxy_pass http://127.0.0.1:18760;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
        proxy_send_timeout 20s;
    }
    location = / {
        default_type text/plain;
        return 200 "GPU Radar is running. Connect with the macOS app.\n";
    }
    location / { return 404; }
}
